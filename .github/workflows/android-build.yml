name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks android/android.keystore --ks-pass pass:android --ks-key-alias android --key-pass pass:android --out android/Safety-Mesh.apk android/app-release-aligned.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyMesh-APK
          path: android/Safety-Mesh.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: SafetyMesh Release v1.0.1
          files: android/Safety-Mesh.apk
          make_latest: true
